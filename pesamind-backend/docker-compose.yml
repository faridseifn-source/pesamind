services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pesamind
      POSTGRES_PASSWORD: pesamind
      POSTGRES_DB: pesamind
    ports:
      - "5432:5432"
    volumes:
      - pesamind_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesamind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://pesamind:pesamind@db:5432/pesamind?schema=public
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      KYC_PROVIDER: mock
      PAYMENTS_RAIL_PROVIDER: mock
      CARD_FUNDING_PROVIDER: mock
      CARD_ISSUING_PROVIDER: mock
      KYC_AMOUNT_THRESHOLD_TZS: 50000
      MAX_LOGIN_ATTEMPTS: 5
      LOGIN_LOCKOUT_MINUTES: 15
      MAX_KYC_ATTEMPTS: 5
    command: sh -c "npx prisma migrate deploy && npm run seed && npm start"

volumes:
  pesamind_db_data:
